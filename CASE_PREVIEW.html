<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case INC-2026-0006 — Investigation Workspace</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f7f9; --surface:#ffffff; --ink:#12171f; --ink2:#4a5666; --ink3:#7d8899;
  --line:#e2e6ec; --line2:#cdd4de;
  --ok:#0f7b5f; --okbg:#e7f5f0;
  --warn:#8a5a00; --warnbg:#fdf3e0;
  --bad:#a3282d; --badbg:#fdeced;
  --mute:#5b6675; --mutebg:#eef0f3;
  --accent:#1b4f8f; --accentbg:#e8f0fa;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:20px 20px 60px}

/* ---------- header ---------- */
.hdr{background:var(--surface);border:1px solid var(--line);border-radius:10px;
     padding:16px 18px;margin-bottom:14px}
.hdr-top{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);
         font-weight:650}
h1{margin:2px 0 0;font-size:22px;letter-spacing:-.02em;font-weight:680}
.sub{color:var(--ink2);font-size:13px;margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:0;margin-top:14px;border-top:1px solid var(--line);
      padding-top:12px}
.meta div{padding-right:26px;margin-right:26px;border-right:1px solid var(--line)}
.meta div:last-child{border-right:0}
.mk{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:650}
.mv{font-family:var(--mono);font-size:13px;margin-top:2px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;
      padding:3px 9px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)} .p-mute{background:var(--mutebg);color:var(--mute)}
.p-acc{background:var(--accentbg);color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ---------- verdict ---------- */
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:780px){.verdict{grid-template-columns:1fr}}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;
       position:relative;overflow:hidden}
.vcard.shown{border-color:#f0c9cb}
.vcard.shown::before,.vcard.truth::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.vcard.shown::before{background:var(--bad)}
.vcard.truth::before{background:var(--accent)}
.vlab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink3)}
.vtitle{font-size:19px;font-weight:680;letter-spacing:-.015em;margin:7px 0 6px}
.vnum{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.vnote{font-size:12.5px;color:var(--ink2);margin-top:9px}

/* ---------- generic panel ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;
       margin-bottom:14px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfcfd}
.ph h2{margin:0;font-size:13px;font-weight:680;letter-spacing:.005em}
.ph .n{font-family:var(--mono);font-size:10.5px;color:var(--ink3);
       background:var(--mutebg);padding:2px 6px;border-radius:4px}
.pb{padding:16px}

/* ---------- evidence chain ---------- */
.chain{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:900px){.chain{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.chain{grid-template-columns:repeat(2,1fr)}}
.stage{border:1px solid var(--line);border-radius:8px;padding:11px;background:#fdfdfe}
.stage.nodata{background:#fafafa;border-style:dashed}
.st-n{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.st-t{font-size:12.5px;font-weight:650;margin:3px 0 8px;letter-spacing:-.005em}
.st-v{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.01em}
.st-u{font-size:10.5px;color:var(--ink3)}
.st-w{font-size:10.5px;color:var(--warn);margin-top:7px;line-height:1.35}

/* ---------- provider strip ---------- */
.prov{display:flex;flex-wrap:wrap;gap:8px}
.prov .item{display:flex;align-items:center;gap:7px;border:1px solid var(--line);
            border-radius:7px;padding:8px 11px;font-size:12px;background:#fdfdfe}
.prov .item b{font-weight:650}

/* ---------- map ---------- */
.mapbox{background:#0d1620;border-radius:8px;overflow:hidden;position:relative}
svg.map{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:11px 14px;background:#0d1620;
        border-top:1px solid #1e2c3a}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;color:#b8c6d4}
.sw{width:13px;height:9px;border-radius:2px;flex:none}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
   color:var(--ink3);font-weight:680;padding:8px 10px;border-bottom:1px solid var(--line2);
   white-space:nowrap;background:#fbfcfd;position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.m{font-family:var(--mono);font-size:12px}
.rank{font-family:var(--mono);font-weight:650;color:var(--ink3)}
.vname{font-weight:620}
.tie{font-size:9.5px;color:var(--bad);font-weight:700;letter-spacing:.04em}
.bar{position:relative;height:5px;border-radius:3px;background:var(--mutebg);
     width:78px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.scroll{max-height:420px;overflow:auto}

/* ---------- factor mini-bars ---------- */
.fx{display:flex;gap:3px;align-items:flex-end;height:22px}
.fx span{width:9px;background:var(--accentbg);border-radius:2px 2px 0 0;position:relative}
.fx span i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:2px 2px 0 0}

/* ---------- uncertainty ---------- */
.uc{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(max-width:700px){.uc{grid-template-columns:1fr}}
.ucr{display:flex;align-items:center;justify-content:space-between;gap:10px;
     border:1px solid var(--line);border-radius:7px;padding:10px 12px}
.ucr.absent{background:#fafafa;border-style:dashed}
.ucn{font-size:12.5px;font-weight:600}
.ucw{font-size:10.5px;color:var(--ink3);margin-top:1px}

/* ---------- notes ---------- */
.note{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.note:last-child{border-bottom:0}
.note .tag{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 6px;
           border-radius:4px;height:fit-content;letter-spacing:.03em}
.t-crit{background:var(--badbg);color:var(--bad)}
.t-hi{background:var(--warnbg);color:var(--warn)}
.t-info{background:var(--accentbg);color:var(--accent)}
.note code{font-family:var(--mono);font-size:11.5px;background:var(--mutebg);
           padding:1px 4px;border-radius:3px}
.note b{font-weight:650}

/* ---------- audit ---------- */
.aud{font-family:var(--mono);font-size:11.5px}
.aud .row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.aud .row:last-child{border-bottom:0}
.aud .ts{color:var(--ink3);flex:none;width:150px}
.aud .ac{color:var(--accent);flex:none;width:120px}
.aud .dt{color:var(--ink2);word-break:break-all}

.foot{text-align:center;color:var(--ink3);font-size:11.5px;margin-top:22px;line-height:1.6}
.banner{background:var(--warnbg);border:1px solid #f0dcb4;border-radius:8px;
        padding:11px 14px;font-size:12.5px;color:#6f4a06;margin-bottom:14px}
.banner b{font-weight:700}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById("payload").textContent);
const C = D.case, R = D.run, P = D.pipeline;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const KMLAT = 110.574, KMLON = lat => 111.320 * Math.cos(lat * Math.PI / 180);
const fx = (n, d=2) => (n === null || n === undefined || Number.isNaN(n)) ? "—" : Number(n).toFixed(d);

/* ---------------- banner ---------------- */
$("banner").innerHTML = "<b>Preview built from your live database.</b> Every value below is read "
 + "verbatim from <code>oil_spill.db</code> → <code>cases.id=6</code> and its run record. "
 + "Nothing is simulated, and no number has been recomputed or smoothed. Fields the pipeline "
 + "stored as <code>null</code> are shown as absent rather than filled in.";

/* ---------------- header ---------------- */
const stPill = {approved:"p-ok", pending_review:"p-warn", in_progress:"p-acc",
                returned:"p-bad", closed:"p-mute", insufficient_evidence:"p-mute"};
$("hdr").innerHTML = `
 <div class="hdr-top">
   <div>
     <div class="eyebrow">Marine oil-spill investigation · Case file</div>
     <h1>${esc(C.case_number)}</h1>
     <div class="sub">${esc(C.location_name)} · detection date ${esc(C.detection_date)}</div>
   </div>
   <div style="display:flex;gap:7px;flex-wrap:wrap">
     <span class="pill ${stPill[C.status]||"p-mute"}"><i class="dot"></i>${esc(C.status.replace(/_/g," "))}</span>
     <span class="pill ${R.status==="succeeded"?"p-ok":"p-mute"}"><i class="dot"></i>run ${esc(R.status)}</span>
   </div>
 </div>
 <div class="meta">
   <div><div class="mk">Detection point</div><div class="mv">${fx(C.lon,4)}, ${fx(C.lat,4)}</div></div>
   <div><div class="mk">Run id</div><div class="mv">${esc(R.run_id)}</div></div>
   <div><div class="mk">Stage</div><div class="mv">${esc(R.current_stage)} · ${fx(R.progress_percent,0)}%</div></div>
   <div><div class="mk">Pipeline status</div><div class="mv">${esc(P.status)}</div></div>
   <div><div class="mk">Completed</div><div class="mv">${esc((R.completed_at||"").slice(0,19)||"—")}</div></div>
 </div>`;

/* ---------------- verdict ---------------- */
/* What the shipped build renders today: Panel1Detection.jsx:102 thresholds overall_confidence. */
const oc = C.overall_confidence;
const shownLabel = oc >= 0.75 ? "Likely oil spill"
                 : oc >= 0.5  ? "Probable oil spill"
                 : oc >= 0.25 ? "Uncertain / review required"
                 : "Likely false detection";
const nDet = (P.detections || []).length;
const hasChar = !!P.characterization, hasAge = !!P.age, hasEo = !!P.eo;
$("verdict").innerHTML = `
 <div class="vcard shown">
   <div class="vlab">What the current build displays</div>
   <div class="vtitle">${esc(shownLabel)}</div>
   <div class="vnum">${(oc*100).toFixed(0)}<span style="font-size:16px;color:var(--ink3)">% confidence</span></div>
   <div class="vnote">Rendered from <code>overall_confidence = ${fx(oc,2)}</code>. That number is the mean of
     the age-confidence ladder and <code>forecast.confidence</code> — and
     <code>forecast.confidence</code> is the fraction of transport particles that stayed inside the
     current-field domain. <b>Nothing in that chain measures whether the target is oil.</b></div>
 </div>
 <div class="vcard truth">
   <div class="vlab">What this case's data actually supports</div>
   <div class="vtitle">No detection evidence — verdict cannot be issued</div>
   <div class="vnum">${nDet}<span style="font-size:16px;color:var(--ink3)"> slicks detected</span></div>
   <div class="vnote">SAR was unavailable for this run, so there are <b>zero</b> detections, and
     characterisation, age and the optical cross-check are all <code>null</code>. The transport model
     still ran — from the operator-entered point, not from an observed slick — which is why a
     confidence of ${(oc*100).toFixed(0)}% coexists with no observation of oil.</div>
 </div>`;

/* ---------------- evidence chain ---------------- */
const ps = R.provider_status || {};
const stages = [
 {n:"01", t:"Detection (SAR)", ok:nDet>0,
  v:nDet>0?`${nDet} slicks`:"no data", u:`sar_available = ${P.sar_available}`,
  w:nDet===0?`provider_status.sar = "${ps.sar}" — Sentinel-1 scene was never retrieved`:""},
 {n:"02", t:"Characterisation", ok:hasChar,
  v:hasChar?`${fx(P.characterization.total_area_km2,2)} km²`:"not run",
  u:hasChar?"total_area_km2":"characterization = null",
  w:hasChar?"":"depends on detections — skipped"},
 {n:"03", t:"Age estimate", ok:hasAge,
  v:hasAge?`${fx(P.age.age_hours,1)} h`:"not run",
  u:hasAge?`${fx(P.age.age_min_hours,1)}–${fx(P.age.age_max_hours,1)} h`:"age = null",
  w:hasAge?"":"requires slick contrast — skipped"},
 {n:"04", t:"Optical cross-check", ok:hasEo,
  v:hasEo?"run":"not run", u:hasEo?"":"eo = null",
  w:hasEo?"":"Sentinel-2 confirmation absent"},
 {n:"05", t:"Transport", ok:true,
  v:"origin fixed", u:`status "${P.status}"`,
  w:`ran from the entered point, not an observed slick`},
 {n:"06", t:"AIS + attribution", ok:(P.suspects||[]).length>0,
  v:`${(P.suspects||[]).length} vessels`, u:`gfw_available = ${P.gfw_available}`,
  w:"all scored; see integrity notes"}
];
$("chain-n").textContent = `${stages.filter(s=>s.ok).length} of 6 stages produced data`;
$("chain").innerHTML = stages.map(s => `
 <div class="stage${s.ok?"":" nodata"}">
   <div class="st-n">${s.n}</div>
   <div class="st-t">${s.t}</div>
   <div class="st-v" style="color:${s.ok?"var(--ink)":"var(--ink3)"}">${esc(s.v)}</div>
   <div class="st-u">${esc(s.u)}</div>
   ${s.w?`<div class="st-w">${s.w}</div>`:""}
 </div>`).join("");

/* ---------------- providers ---------------- */
const pmap = {ok:["p-ok","reachable, returned data"],
              warn:["p-warn","degraded"],
              unavailable:["p-bad","not reachable"],
              no_particles:["p-warn","ran, no particles retained"]};
$("prov").innerHTML = Object.entries(ps).map(([k,v]) => {
  const m = pmap[v] || ["p-mute", v];
  return `<div class="item"><span class="pill ${m[0]}"><i class="dot"></i>${esc(v)}</span>
          <span><b>${esc(k.toUpperCase())}</b> — ${esc(m[1])}</span></div>`;
}).join("") + `<div class="item"><span class="pill ${(R.warnings||[]).length?"p-warn":"p-bad"}">
   <i class="dot"></i>${(R.warnings||[]).length} warnings</span>
   <span>pipeline emitted <b>${(P.warnings||[]).length}</b> — an unavailable provider left no trace</span></div>`;

/* ---------------- map ---------------- */
const ob = P.origin_bbox, oc2 = P.origin_centroid, F = P.forecast || {};
const fb = F.bbox, fc = F.centroid, path = F.median_path || [];
const vessels = (P.suspects || []).slice();
const pts = [[C.lon,C.lat], oc2, fc, ...path,
             [ob[0],ob[1]],[ob[2],ob[3]],[fb[0],fb[1]],[fb[2],fb[3]],
             ...vessels.map(v=>[v.avg_lon,v.avg_lat])].filter(p=>p&&p.length===2);
const lons = pts.map(p=>p[0]), lats = pts.map(p=>p[1]);
const padx = (Math.max(...lons)-Math.min(...lons))*0.10 || 0.02;
const pady = (Math.max(...lats)-Math.min(...lats))*0.12 || 0.02;
const X0 = Math.min(...lons)-padx, X1 = Math.max(...lons)+padx;
const Y0 = Math.min(...lats)-pady, Y1 = Math.max(...lats)+pady;
const W=960,H=520,M={l:52,r:16,t:16,b:34};
const sx = x => M.l + (x-X0)/(X1-X0)*(W-M.l-M.r);
const sy = y => H-M.b - (y-Y0)/(Y1-Y0)*(H-M.t-M.b);

let g = "";
/* graticule */
const nx=6, ny=5;
for(let i=0;i<=nx;i++){const lo=X0+(X1-X0)*i/nx, x=sx(lo);
  g+=`<line x1="${x}" y1="${M.t}" x2="${x}" y2="${H-M.b}" stroke="#1c2a38" stroke-width="1"/>
      <text x="${x}" y="${H-M.b+16}" fill="#6b7b8c" font-size="10" font-family="ui-monospace,monospace" text-anchor="middle">${lo.toFixed(3)}°E</text>`;}
for(let i=0;i<=ny;i++){const la=Y0+(Y1-Y0)*i/ny, y=sy(la);
  g+=`<line x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}" stroke="#1c2a38" stroke-width="1"/>
      <text x="${M.l-7}" y="${y+3}" fill="#6b7b8c" font-size="10" font-family="ui-monospace,monospace" text-anchor="end">${la.toFixed(3)}°N</text>`;}

/* forecast bbox */
g += `<rect x="${sx(fb[0])}" y="${sy(fb[3])}" width="${sx(fb[2])-sx(fb[0])}" height="${sy(fb[1])-sy(fb[3])}"
       fill="#e8963c" fill-opacity=".08" stroke="#e8963c" stroke-width="1.4" stroke-dasharray="7 4" rx="2"/>
      <text x="${sx(fb[0])+7}" y="${sy(fb[3])+15}" fill="#f0b464" font-size="10.5"
       font-family="ui-monospace,monospace">forward spread envelope</text>`;
/* origin bbox */
g += `<rect x="${sx(ob[0])}" y="${sy(ob[3])}" width="${sx(ob[2])-sx(ob[0])}" height="${sy(ob[1])-sy(ob[3])}"
       fill="#3d8fd6" fill-opacity=".11" stroke="#3d8fd6" stroke-width="1.4" rx="2"/>
      <text x="${sx(ob[0])+7}" y="${sy(ob[3])+15}" fill="#7fbdf0" font-size="10.5" font-family="ui-monospace,monospace">origin search region</text>`;

/* median path */
if(path.length){
  g += `<polyline points="${path.map(p=>`${sx(p[0])},${sy(p[1])}`).join(" ")}"
         fill="none" stroke="#e8963c" stroke-width="2.2" stroke-linejoin="round" opacity=".9"/>`;
  path.forEach((p,i)=>{ if(i%4===0) g+=`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="2.1" fill="#e8963c" opacity=".75"/>`; });
}

/* vessel grid cells */
const cell = 0.1, byCell = {};
vessels.forEach(v=>{ const k=`${v.avg_lon.toFixed(3)}|${v.avg_lat.toFixed(3)}`;
  (byCell[k] = byCell[k] || {lon:v.avg_lon, lat:v.avg_lat, list:[]}).list.push(v); });
Object.values(byCell).forEach(cl=>{
  const x=sx(cl.lon-cell/2), y=sy(cl.lat+cell/2), w=sx(cl.lon+cell/2)-x, h=sy(cl.lat-cell/2)-y;
  g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#c7566b" fill-opacity=".10"
         stroke="#c7566b" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="${sx(cl.lon)}" cy="${sy(cl.lat)}" r="${Math.min(17, 6+cl.list.length*0.9)}"
         fill="#c7566b" fill-opacity=".42" stroke="#e8879a" stroke-width="1.3"/>
        <text x="${sx(cl.lon)}" y="${sy(cl.lat)+4}" fill="#fff" font-size="11" font-weight="700"
         font-family="ui-monospace,monospace" text-anchor="middle">${cl.list.length}</text>`;
});

/* centroids + detection point */
const cross = (x,y,c,r=8) => `<line x1="${x-r}" y1="${y}" x2="${x+r}" y2="${y}" stroke="${c}" stroke-width="2"/>
                              <line x1="${x}" y1="${y-r}" x2="${x}" y2="${y+r}" stroke="${c}" stroke-width="2"/>`;
g += cross(sx(oc2[0]), sy(oc2[1]), "#7fbdf0");
g += `<circle cx="${sx(oc2[0])}" cy="${sy(oc2[1])}" r="4.5" fill="#3d8fd6" stroke="#0d1620" stroke-width="1.5"/>`;
g += cross(sx(fc[0]), sy(fc[1]), "#f0b464");
g += `<circle cx="${sx(fc[0])}" cy="${sy(fc[1])}" r="4.5" fill="#e8963c" stroke="#0d1620" stroke-width="1.5"/>`;
g += `<rect x="${sx(C.lon)-5}" y="${sy(C.lat)-5}" width="10" height="10" fill="#f2f6fa"
       stroke="#0d1620" stroke-width="1.5" transform="rotate(45 ${sx(C.lon)} ${sy(C.lat)})"/>`;
$("map").innerHTML = g;

const obW = (ob[2]-ob[0])*KMLON(oc2[1]), obH = (ob[3]-ob[1])*KMLAT;
const fbW = (fb[2]-fb[0])*KMLON(fc[1]),  fbH = (fb[3]-fb[1])*KMLAT;
const dOrigin = Math.hypot((oc2[0]-C.lon)*KMLON(C.lat), (oc2[1]-C.lat)*KMLAT);
$("map-n").textContent = `origin region ${obW.toFixed(1)} × ${obH.toFixed(1)} km · forecast ${fbW.toFixed(1)} × ${fbH.toFixed(1)} km`;
$("legend").innerHTML = [
 ['<span class="sw" style="background:#f2f6fa;transform:rotate(45deg)"></span>',
  `operator-entered detection point · ${fx(C.lon,3)}, ${fx(C.lat,3)}`],
 ['<span class="sw" style="background:#3d8fd6"></span>',
  `backward origin centroid · ${dOrigin.toFixed(1)} km from entry point`],
 ['<span class="sw" style="background:#3d8fd6;opacity:.35"></span>',
  `origin search region · <b>bounding box only, no confidence ellipse, no time window</b>`],
 ['<span class="sw" style="background:#e8963c"></span>',
  `forward median path · ${path.length} steps`],
 ['<span class="sw" style="background:#e8963c;opacity:.35"></span>',
  `spread envelope · <b>box, not a percentile cone</b>`],
 ['<span class="sw" style="background:#c7566b"></span>',
  `AIS presence cells · ${Object.keys(byCell).length} distinct 0.1° cells for ${vessels.length} vessels`]
].map(([s,t]) => `<div class="lg">${s}<span>${t}</span></div>`).join("");

/* ---------------- vessel table ---------------- */
vessels.sort((a,b) => (b.attribution_score||0) - (a.attribution_score||0));
const scores = vessels.map(v=>v.attribution_score||0);
const top = Math.max(...scores), nTop = scores.filter(s=>s===top).length;
const distinct = new Set(scores).size;
$("ves-n").textContent = `${vessels.length} candidates · ${distinct} distinct scores · range ${Math.min(...scores).toFixed(3)}–${top.toFixed(3)}`;

const FK = ["proximity","cargo","duration","behaviour"], FW = {proximity:.35,cargo:.30,duration:.20,behaviour:.15};
$("vtab").innerHTML = `<thead><tr>
  <th>#</th><th>Vessel</th><th>MMSI</th><th>Flag</th><th>Type</th>
  <th>Score</th><th>Factors<br><span style="font-weight:400;text-transform:none;letter-spacing:0">prox/cargo/dur/behav</span></th>
  <th>Prox</th><th>Hours</th><th>Cell</th><th>Assessment</th></tr></thead><tbody>` +
 vessels.slice(0,15).map((v,i) => {
   const f = v.factors || {};
   return `<tr>
     <td class="rank">${i+1}${i<nTop&&nTop>1?` <span class="tie">TIE</span>`:""}</td>
     <td class="vname">${esc(v.vessel_name||"—")}</td>
     <td class="m">${esc(v.mmsi)}</td>
     <td class="m">${esc(v.flag||"—")}</td>
     <td style="font-size:11px;color:var(--ink2)">${esc((v.ship_type||"").replace(/_/g," ").toLowerCase())}</td>
     <td class="m"><b>${fx(v.attribution_score,4)}</b><br><span class="bar"><i style="width:${(v.attribution_score/0.4*100).toFixed(0)}%"></i></span></td>
     <td><div class="fx">${FK.map(k=>`<span style="height:22px"><i style="height:${((f[k]||0)*22).toFixed(0)}px"></i></span>`).join("")}</div></td>
     <td class="m" style="color:${(f.proximity||0)<0.2?"var(--bad)":"var(--ink)"}">${fx(f.proximity,3)}</td>
     <td class="m">${fx(v.presence_hours,0)}</td>
     <td class="m" style="font-size:11px;color:var(--ink3)">${fx(v.avg_lon,2)}, ${fx(v.avg_lat,2)}</td>
     <td><span class="pill p-mute"><i class="dot"></i>candidate source</span></td>
   </tr>`; }).join("") + `</tbody>`;

/* ---------------- uncertainty ---------------- */
const factors = [
 ["Detector / model confidence", false, "detect_dark_spots returns no per-detection score"],
 ["Image quality", false, "not computed anywhere in the pipeline"],
 ["Temporal persistence", false, "max_products = 1 — single scene only"],
 ["CFAR / U-Net / EO agreement", false, "no U-Net checkpoint committed; EO never receives the SAR detections"],
 ["Weather / current consistency", false, "not computed"],
 ["Look-alike risk", false, "frontend fabricates it as 1 − confidence, not an independent test"],
 ["Transport uncertainty", true, `spread_deg ${fx(F.spread_deg?.[0],4)}, ${fx(F.spread_deg?.[1],4)} · dominated by a fixed diffusion constant`],
 ["Independent sensor agreement", false, "no second sensor wired in"]
];
$("uc-n").textContent = `${factors.filter(f=>f[1]).length} of 8 available`;
$("uc").innerHTML = factors.map(([n,ok,w]) => `
 <div class="ucr${ok?"":" absent"}">
   <div><div class="ucn">${esc(n)}</div><div class="ucw">${w}</div></div>
   <span class="pill ${ok?"p-warn":"p-mute"}"><i class="dot"></i>${ok?"partial":"unavailable"}</span>
 </div>`).join("");

/* ---------------- notes ---------------- */
const cargo1 = vessels.filter(v=>(v.factors||{}).cargo===1.0).length;
const maxProx = Math.max(...vessels.map(v=>(v.factors||{}).proximity||0));
const transitOk = vessels.filter(v=>v.transit_ok).length;
const notes = [
 ["crit", `<b>Confidence of ${(oc*100).toFixed(0)}% on zero observations.</b> This case stored
   <code>overall_confidence = ${fx(oc,2)}</code> while <code>detections</code> is empty and
   <code>characterization</code>, <code>age</code> and <code>eo</code> are all <code>null</code>.
   <code>forecast.confidence = ${fx(F.confidence,2)}</code> is particle retention, so a run in which
   the satellite was never reached still produces a maximal score.`],
 ["crit", `<b>An unavailable provider left no trace.</b> <code>provider_status.sar = "${ps.sar}"</code>
   on the run record, yet <code>sar_available = ${P.sar_available}</code> inside the result and
   <code>warnings</code> is an empty array. A UI reading only <code>pipeline_result</code> cannot tell
   a failed download from a genuinely clean scene.`],
 ["crit", `<b>Vessel positions are ${Object.keys(byCell).length} grid cells, not ${vessels.length} tracks.</b>
   Every vessel resolves to one of ${Object.keys(byCell).length} distinct 0.1° GFW presence-grid
   centres — roughly 11 km across. Proximity is therefore measured against a cell, not a ship, so
   the 35%-weighted factor cannot support a claim about which vessel was nearest.`],
 ["hi", `<b>Rank 1 is a coin flip.</b> ${nTop} vessels tie at exactly <code>${top.toFixed(4)}</code>, and
   41 vessels share only ${distinct} distinct scores. <code>Panel6Attribution.jsx:72</code> labels
   whichever sorts first “Probable source vessel” purely by position.`],
 ["hi", `<b>No vessel is actually close.</b> The highest proximity factor across all ${vessels.length}
   candidates is <code>${maxProx.toFixed(3)}</code>. Meanwhile ${cargo1} vessels score a full
   <code>1.0</code> on cargo, so the ranking is driven by the cargo term rather than by any spatial link.`],
 ["hi", `<b>The transit filter removed nothing.</b> <code>transit_ok</code> is true for
   ${transitOk} of ${vessels.length} vessels, so candidate reduction for this case is
   ${vessels.length} → ${transitOk} — a ratio of 1.00. There is no narrowing to report.`],
 ["hi", `<b>Origin is a box, not a distribution.</b> The ${obW.toFixed(1)} × ${obH.toFixed(1)} km
   region carries no confidence ellipse and no time window. The tracker does compute a positional
   standard deviation, and <code>pipeline.py:300</code> discards it before it reaches the API.`],
 ["info", `<b>Reproducibility.</b> <code>input_scene_ids</code>, <code>metocean_data_ids</code> and
   <code>model_version_ids</code> are all empty on this run, and the integrators seed no RNG — so
   re-running this case would not reproduce this origin exactly.`]
];
$("notes").innerHTML = notes.map(([t,h]) =>
  `<div class="note"><span class="tag t-${t}">${t==="crit"?"CRITICAL":t==="hi"?"HIGH":"NOTE"}</span><div>${h}</div></div>`).join("");

/* ---------------- audit ---------------- */
$("aud-n").textContent = `${(D.audit||[]).length} entries for this case`;
$("aud").innerHTML = (D.audit||[]).length
 ? D.audit.map(a => `<div class="row"><span class="ts">${esc((a.timestamp||"").slice(0,19))}</span>
     <span class="ac">${esc(a.action_type)}</span>
     <span class="dt">${esc(a.actor||"—")} (${esc(a.actor_role||"?")}) · ${esc(a.detail||"")}</span></div>`).join("")
 : `<div style="color:var(--ink3)">No audit entries.</div>`;

$("foot").innerHTML = `Rendered from <code>oil_spill.db</code> · case ${esc(C.case_number)} ·
  run ${esc(R.run_id)} · pipeline blob ${JSON.stringify(P).length.toLocaleString()} chars<br>
  This is a read-only preview of real stored output. It is not the React application running.`;
</script>
</body>
</html>
